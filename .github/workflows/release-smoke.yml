# Tagged release for the Linux x86_64 desktop.
#
# Runs only on `v*` tags. One job runs the project check entry `make check`
# exactly once (the same closure as `ci`, no duplicated build); the check
# stages, archives, and verifies the distribution itself, then exports the
# tested archive bytes plus `<archive>.sha256` (sha256sum text format) via
# ARCHIVE_OUT. This workflow publishes exactly those tested bytes and never
# rebuilds, re-archives, or re-verifies. Nothing touches branch protection.
#
name: release-smoke

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.5"

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            attr btop build-essential libssl-dev neovim pkg-config tmux vim

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install --profile minimal --component rustfmt,clippy
          case "$(rustc --version)" in
            "rustc ${channel}."*) ;;
            *) echo "error: expected rustc ${channel}.x, got: $(rustc --version)" >&2; exit 1 ;;
          esac

      - name: Set up Python for developer checks
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv for developer checks
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Clone the pinned upstream Zellij checkout
        working-directory: ${{ runner.temp }}
        run: |
          pin="$(sed -n 's/^PINNED_HEAD="\(.*\)"/\1/p' "${GITHUB_WORKSPACE}/scripts/build-zellij-core-navigation.sh")"
          test -n "${pin}"
          git clone --no-checkout https://github.com/zellij-org/zellij.git zellij-ci
          git -C zellij-ci checkout "${pin}"
          test "$(git -C zellij-ci rev-parse HEAD)" = "${pin}"
          echo "ZELLIJ_SRC=${RUNNER_TEMP}/zellij-ci" >> "${GITHUB_ENV}"

      - name: Run the project check entry point (exports the tested archive)
        run: make check ARCHIVE_OUT="${RUNNER_TEMP}/tdnext-linux-x86_64.tar.gz"

      - name: Publish the tested native archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "${RUNNER_TEMP}/tdnext-linux-x86_64.tar.gz"
          test -f "${RUNNER_TEMP}/tdnext-linux-x86_64.tar.gz.sha256"
          (cd "${RUNNER_TEMP}" && sha256sum -c tdnext-linux-x86_64.tar.gz.sha256)
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            "${RUNNER_TEMP}/tdnext-linux-x86_64.tar.gz" \
            "${RUNNER_TEMP}/tdnext-linux-x86_64.tar.gz.sha256"
