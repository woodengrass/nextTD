# Tagged release for the Linux x86_64 desktop.
#
# Runs only on `v*` tags. One job runs the project check entry `make check`
# exactly once (the same closure as `ci`, no duplicated build); the check
# stages, archives, and verifies the distribution itself, then exports the
# tested archive bytes plus `<archive>.sha256` (sha256sum text format) via
# ARCHIVE_OUT. install-test.yml then installs those bytes with the two
# install scripts on clean distributions. Only after both pass does publish
# attest (GitHub build provenance) and release exactly those files; it never
# rebuilds, re-archives, or re-verifies. Nothing touches branch protection.
#
name: release-smoke

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.5"

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the checked-out commit
        id: source
        run: |
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            attr btop build-essential libssl-dev musl-tools neovim pkg-config tmux vim

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          rustup toolchain install --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-musl
          case "$(rustc --version)" in
            "rustc ${channel}."*) ;;
            *) echo "error: expected rustc ${channel}.x, got: $(rustc --version)" >&2; exit 1 ;;
          esac

      - name: Set up Python for developer checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv for developer checks
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Clone the pinned upstream Zellij checkout
        working-directory: ${{ runner.temp }}
        run: |
          pin="$(sed -n 's/^PINNED_HEAD="\(.*\)"/\1/p' "${GITHUB_WORKSPACE}/scripts/build-zellij-core-navigation.sh")"
          test -n "${pin}"
          git clone --no-checkout https://github.com/zellij-org/zellij.git zellij-ci
          git -C zellij-ci checkout "${pin}"
          test "$(git -C zellij-ci rev-parse HEAD)" = "${pin}"
          echo "ZELLIJ_SRC=${RUNNER_TEMP}/zellij-ci" >> "${GITHUB_ENV}"

      - name: Run the project check entry point (exports the tested archive)
        run: make check ARCHIVE_OUT="${RUNNER_TEMP}/dist/tdnext-linux-x86_64.tar.gz"

      - name: Add the install scripts from the verified commit
        run: install -m 0755 scripts/install.sh scripts/install-verified-dist.sh "${RUNNER_TEMP}/dist/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dist
          if-no-files-found: error
          path: ${{ runner.temp }}/dist/

  install-test:
    needs: verify
    uses: ./.github/workflows/install-test.yml

  publish:
    needs: [verify, install-test]
    env:
      VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Confirm the tagged commit belongs to main
        run: |
          git init --bare history
          git -C history remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C history fetch --no-tags --filter=blob:none origin \
            refs/heads/main:refs/remotes/origin/main "${GITHUB_REF}:${GITHUB_REF}"
          test "$(git -C history rev-parse "${GITHUB_SHA}^{commit}")" = "$VERIFIED_COMMIT"
          test "$(git -C history rev-parse "${GITHUB_REF}^{commit}")" = "$VERIFIED_COMMIT"
          git -C history merge-base --is-ancestor "$VERIFIED_COMMIT" origin/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dist
          path: assets

      - name: Check the downloaded bytes against the verified digest
        working-directory: assets
        run: |
          test "$(ls | LC_ALL=C sort | tr '\n' ' ')" = "install-verified-dist.sh install.sh tdnext-linux-x86_64.tar.gz tdnext-linux-x86_64.tar.gz.sha256 "
          sha256sum tdnext-linux-x86_64.tar.gz | cmp - tdnext-linux-x86_64.tar.gz.sha256

      - name: Attest build provenance for the published files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/tdnext-linux-x86_64.tar.gz
            assets/install.sh
            assets/install-verified-dist.sh

      - name: Publish the tested native archive and installer
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          asset=tdnext-linux-x86_64.tar.gz
          sha256sum "$asset" | cmp - "$asset.sha256"
          git -C ../history fetch --no-tags origin "$GITHUB_REF"
          test "$(git -C ../history rev-parse 'FETCH_HEAD^{commit}')" = "$VERIFIED_COMMIT"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --target "$VERIFIED_COMMIT" --generate-notes \
            "$asset" "$asset.sha256" install.sh install-verified-dist.sh
