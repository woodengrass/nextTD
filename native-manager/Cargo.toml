[package]
name = "tdnext-manager"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tdnext_manager"
path = "src/lib.rs"

[[bin]]
name = "tdnext"
path = "src/main.rs"

[dependencies]
rustix = { version = "1", features = ["process"] }
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
