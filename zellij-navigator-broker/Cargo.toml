[package]
name = "navigator-broker"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
zellij-tile = "=0.45.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
