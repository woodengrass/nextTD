[package]
name = "tdnext-settings"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustix = { version = "1", features = ["event", "process"] }
signal-hook = "0.3"
anyhow = "1"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tdnext-manager = { path = "../../native-manager" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
