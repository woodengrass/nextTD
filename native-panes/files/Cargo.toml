[package]
name = "tdnext-files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
signal-hook = "0.3"
shlex = "1"
tempfile = "3"
unicode-width = "0.2"
unicase = "2"
unicode-general-category = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
